<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hockey GM</title>
    <meta name="description" content="Jeu de gestion de hockey façon Football Manager" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-180.png" />
    <meta name="theme-color" content="#0A1627" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hockey GM" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #0B1B2E; color: #F0F4F8; }
      /* Téléphone : la barre latérale passe au-dessus, le contenu défile seul. Désactivé par la
         vue bureau forcée (bouton dans la barre latérale, voir App.jsx) : classe "force-desktop"
         sur <body>, qui garde la mise en page PC intacte (défilement/zoom plutôt que réagencement). */
      @media (max-width: 760px) {
        body:not(.force-desktop) #root > div { flex-direction: column !important; }
        body:not(.force-desktop) #root > div > div:first-of-type { width: auto !important; flex-direction: row !important; flex-wrap: wrap; border-right: none !important; }
        body:not(.force-desktop) #root > div > div:nth-of-type(2) { padding: 16px !important; overflow-x: auto; }
        body:not(.force-desktop) #root table { display: block; overflow-x: auto; }
      }
      body.force-desktop { overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
